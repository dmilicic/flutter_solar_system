<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project showcasing implementing a solar system.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="solar_system">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>solar_system</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    /* --- Solar system loader --- */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0b0b1f 0%, #000 70%);
      z-index: 9999;
      transition: opacity 0.6s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .solar {
      position: relative;
      width: 200px;
      height: 200px;
    }

    /* The sun in the middle */
    .sun {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff3b0, #ffb300 45%, #ff6a00 100%);
      box-shadow: 0 0 18px 6px rgba(255, 150, 0, 0.6);
      animation: pulse 2.5s ease-in-out infinite;
    }

    /* Orbit rings carry the planets and spin */
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* Each planet sits at the top of its orbit ring */
    .planet {
      position: absolute;
      top: 0;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit-1 { width: 70px;  height: 70px;  animation: spin 2.4s linear infinite; }
    .orbit-2 { width: 120px; height: 120px; animation: spin 4.2s linear infinite; }
    .orbit-3 { width: 180px; height: 180px; animation: spin 6.8s linear infinite; }

    .planet-1 { width: 8px;  height: 8px;  background: #4fc3f7; }
    .planet-2 { width: 12px; height: 12px; background: #e57373; }
    .planet-3 { width: 10px; height: 10px; background: #aed581; }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 18px 6px rgba(255, 150, 0, 0.6); }
      50%      { box-shadow: 0 0 26px 10px rgba(255, 170, 30, 0.85); }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Lightweight solar-system loader shown until Flutter is ready -->
  <div id="loader">
    <div class="solar">
      <div class="sun"></div>
      <div class="orbit orbit-1"><div class="planet planet-1"></div></div>
      <div class="orbit orbit-2"><div class="planet planet-2"></div></div>
      <div class="orbit orbit-3"><div class="planet planet-3"></div></div>
    </div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('hide');
      loader.addEventListener('transitionend', function() {
        loader.remove();
      });
    }

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            // Flutter is up — fade out the loader.
            removeLoader();
          });
        }
      });
    });
  </script>
</body>
</html>
